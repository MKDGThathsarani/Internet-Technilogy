<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Management System</title>
</head>
<body>
    <h1>School Management System</h1>

    <input type="text" id="txtCustomerId" placeholder="Enter Id"><br><br>
    <input type="text" id="txtCustomerName" placeholder="Enter Name"><br><br>
    <input type="text" id="txtCustomerAge" placeholder="Enter Age"><br><br>
    <input type="text" id="txtCustomerAddress" placeholder="Enter Address"><br><br>

    <hr>
    <input type="button" value="Add Customer" onclick="btnAddCustomerOnAction()">
    <input type="button" value="Search By Id" onclick="btnSearchBYIdOnAction()">
    <input type="button" value="Delete By Id" onclick="btnDeleteBYIdOnAction()">
    <input type="button" value="Update By Id" onclick="btnUpdateBYIdOnAction()">
    <input type="button" value="Clear Storage" onclick="btnClearStorageOnAction()">
    <input type="button" value="Load Table" onclick="btnLoadTableOnAction()">

    <script src="app.js"></script>
</body>
</html>
